<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<title>居家适老化体检 · 安全初检</title>
<style>
:root{--bg:#f6f2ea;--card:#fffdf9;--ink:#2f2b26;--sub:#7d7469;--line:#e6ded1;--brand:#8a6a45;--good:#3f7d5c;--mid:#b9891f;--bad:#b4553c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.topbar>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog{flex:0 0 auto;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}
h1{font-size:clamp(20px,5.6vw,24px);line-height:1.4;margin:0 0 10px;font-weight:600}
h2{font-size:19px;margin:0 0 12px;font-weight:600}
p{margin:0 0 12px}
.sub{color:var(--sub);font-size:14px}
.btn{display:block;width:100%;padding:15px;border:0;touch-action:manipulation;border-radius:12px;background:var(--brand);color:#fff;font-size:17px;font-weight:600;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;touch-action:manipulation;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;line-height:1.5;color:var(--ink)}
.opt.sel{border-color:var(--brand);background:#fbf6ee}
.field{margin:12px 0}
.field label{display:block;font-size:14px;color:var(--sub);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.bar{height:9px;border-radius:9px;background:#efe8dc;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--brand)}
.row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:2px}
.score{font-size:52px;font-weight:700;line-height:1.1}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;background:#f0e7d8;color:var(--brand)}
.fix{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.fix b{display:block;margin-bottom:4px}
.mini{font-size:13px;color:var(--sub);margin-top:6px}
#bgmbtn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;touch-action:manipulation;width:42px;height:42px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%;border:1px solid #8a6a45;background:#fffdf9;color:#8a6a45;box-shadow:0 2px 12px rgba(0,0,0,.12);cursor:pointer}
#bgmbtn .i-on{display:block}
#bgmbtn .i-off{display:none}
#bgmbtn.off .i-on{display:none}
#bgmbtn.off .i-off{display:block}
#bgmbtn.off{color:#8d8478;border-color:#e6ded1;background:#faf7f1}
#bgmbtn.off{color:#7d7469;border-color:#e6ded1;background:#faf7f1}
.foot{max-width:620px;margin:0 auto;padding:0 18px 30px;font-size:12px;color:var(--sub);line-height:1.6}
.pill{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;background:#f3ece0;color:var(--sub);margin-left:6px}
.warn{color:var(--bad)}
.ok{color:var(--good)}
.hint{background:#fbf6ee;border-left:3px solid var(--brand);padding:10px 12px;border-radius:8px;font-size:14px;margin:12px 0}
.opt:active{background:#f6efe3}
.btn:active{opacity:.88}
@media (max-width:420px){
h1{font-size:21px}
h2{font-size:18px}
.card{padding:18px 16px;border-radius:14px}
.wrap{padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.topbar{font-size:12px;padding:12px 0}
.score{font-size:46px}
.btn{padding:16px 14px;font-size:16px}
.opt{padding:14px;font-size:15px}
.foot{padding:0 14px 26px;font-size:11px}
}
</style>
</head>

const ITEM = {"items":{"S01":{"why":"结构裂缝会继续发展，先要分清是抹灰层裂还是受力裂缝。","do":"在裂缝上贴纸或石膏做标记、记日期，观察两周；不发展的先修补，继续发展找专业鉴定。","cost":"观察与修补 200 到 1000 元；结构鉴定 1000 到 3000 元，加固按方案另计（行业经验值）"},"S02":{"why":"渗水会让基层松散、墙皮发霉，也影响老人呼吸舒适。","do":"先找漏水点再修面层：管漏先修管，外墙与屋面找专业防水，室内霉斑先除霉再刷防霉涂料。","cost":"局部修补 1000 到 5000 元；屋面外墙整体翻修 10000 到 30000 元（行业经验值）"},"S03":{"why":"透风窗冬天散热快，室内温度上不来，老人更怕冷。","do":"先换密封条加厚窗帘应急；条件允许换双层中空玻璃或加装内窗。","cost":"密封改造 200 到 800 元；换窗按平米 800 到 2000 元（行业经验值）"},"S04":{"why":"拧不动的把手会让老人干脆不开窗，通风就少了。","do":"换成加长手柄或杠杆式把手，顺手做一次五金润滑。","cost":"100 到 400 元（行业经验值）"},"E01":{"why":"频繁跳闸和裸露线路说明线路老化或过载，是隐患。","do":"找持证电工按回路排查，先换老化支路与插座，不要只把空开换大。","cost":"500 到 3000 元（行业经验值）"},"E02":{"why":"卫生间潮湿，没有漏电保护时后果更重。","do":"卫生间回路加装漏电保护开关；装好后每月按一次试验按钮。","cost":"200 到 600 元（行业经验值）"},"E03":{"why":"反味多来自水封失效，经常堵说明坡度或存水弯有问题。","do":"换带水封的地漏芯，洗面盆加存水弯；仍堵找专业疏通查坡。","cost":"100 到 800 元（行业经验值）"},"E04":{"why":"水温忽冷忽热会让老人中途调水，容易着凉或烫到。","do":"换恒温热水器或加恒温混水阀；老热水器先查镁棒与安全阀。","cost":"800 到 3000 元（行业经验值）"},"D01":{"why":"门洞不够宽，轮椅和担架进不来，急救会被耽误。","do":"量离地 80 到 120 厘米那一段的净宽；不够先改门扇与门框，再考虑动墙体。","cost":"改门扇门框 800 到 2000 元；动墙体 3000 元以上（行业经验值）"},"D02":{"why":"厨卫门太窄，助行器容易卡住。","do":"先量净宽，卧室门补到 80 厘米、厨卫门补到 70 厘米；拆门套比拆墙便宜。","cost":"500 到 2000 元（行业经验值）"},"D03":{"why":"门开不到 90 度，推轮椅或搀扶时转身空间不够。","do":"把门后柜子与挂物挪走，换薄型门后挂件。","cost":"0 到 300 元（行业经验值）"},"D04":{"why":"球形把手对手劲小的老人不友好，容易拧不动。","do":"换杠杆式或回弯把手，中心距地 900 到 1000 毫米。","cost":"单把 50 到 200 元（行业经验值）"},"G01":{"why":"单脚撑墙换鞋那几秒最不稳。","do":"换一张带扶手的换鞋凳，凳子贴鞋柜放，旁边留一处能撑的台面。","cost":"200 到 800 元（行业经验值）"},"G02":{"why":"台面高度合适才能当隐形扶手，过高过低都借不上力。","do":"鞋柜台面做到 0.9 到 1.0 米并固定牢固；不换柜就在墙侧加一段扶手。","cost":"加扶手 200 到 500 元（行业经验值）"},"G03":{"why":"手里拎着东西再换鞋，动作一乱就容易绊。","do":"门口设挂钩和固定台面，拐杖有立放位；进门先腾手，再坐下换鞋。","cost":"100 到 500 元（行业经验值）"},"G04":{"why":"玄关暗、有阴影时看不清门锁和地面高差。","do":"鞋柜加灯带、顶面均匀照明，开关放在进门手边，别只靠一个投影灯。","cost":"200 到 800 元（行业经验值）"},"P01":{"why":"踏步高宽不一致最容易踩空。","do":"逐级量踏步高宽并做一致，两侧加连续扶手，扶手末端延伸不少于 300 毫米。","cost":"扶手 500 到 2000 元；踏步整改按方案（行业经验值）"},"P02":{"why":"抬脚跨门槛是常见的绊倒点。","do":"15 毫米以内做倒坡或过渡条，超过的做斜坡或踏步台并加扶手。","cost":"200 到 800 元（行业经验值）"},"P03":{"why":"踮脚伸臂晾晒时重心不稳。","do":"换可升降晾衣杆或低位移动式晾衣架。","cost":"300 到 1500 元（行业经验值）"},"P04":{"why":"积水加湿滑，阳台是常被忽略的湿区。","do":"换防滑砖、重新找坡、加长条地漏扩大过水面积。","cost":"500 到 2000 元（行业经验值）"},"F01":{"why":"湿区地砖是滑倒高发点。","do":"铺防滑垫或做防滑处理，地垫选 TPR 乳胶底贴合的，别用翘边款。","cost":"100 到 800 元（行业经验值）"},"F02":{"why":"高差是绊脚主因，老人视线与抬脚高度都不如从前。","do":"15 毫米以内完全做平，超过的加过渡条改缓坡。","cost":"100 到 500 元（行业经验值）"},"F03":{"why":"散线和翘边地垫都会绊脚。","do":"线路贴地固定、沿墙走；地垫换成贴地固定的，茶几下的散线一并收。","cost":"50 到 300 元（行业经验值）"},"F04":{"why":"通道太窄，助行器和轮椅过不去。","do":"挪开门边家具与柜子，保证主通道净宽 90 厘米。","cost":"0 到 500 元（行业经验值）"},"F05":{"why":"不包脚的拖鞋容易掉，掉了就绊。","do":"换防滑底包脚鞋，家里备一双固定的室内鞋。","cost":"50 到 200 元（行业经验值）"},"B01":{"why":"起坐没有支撑点，是卫生间最常见的失稳点。","do":"加 L 型或落地式扶手并装牢固；通行扶手高度 850 到 900 毫米，末端做延伸。","cost":"200 到 800 元（行业经验值）"},"B02":{"why":"马桶太矮，起身时膝盖和腰都吃力。","do":"加马桶增高器或换合适坐高，坐高 450 到 500 毫米，脚能踩实。","cost":"100 到 500 元（行业经验值）"},"B03":{"why":"跨进跨出浴缸是难度最高的一个动作。","do":"拆浴缸改淋浴，加折叠浴凳与可调高度花洒滑杆，地面做无高差。","cost":"2000 到 5000 元（行业经验值）"},"B04":{"why":"积水加湿滑，湿区最容易出事。","do":"重新找坡或加长条地漏，先临时铺防滑垫过渡。","cost":"300 到 1500 元（行业经验值）"},"B05":{"why":"内开且空间小时，一旦在门后摔倒会挡住门。","do":"改外开或推拉门，门锁改成可外开，方便急救进入。","cost":"800 到 2500 元（行业经验值）"},"B06":{"why":"卫生间是求助最难的地方，摔倒后可能够不到手机。","do":"装按钮加拉绳，按钮在马桶前距地 400 到 500 毫米，拉绳覆盖坐姿与卧姿可及范围。","cost":"200 到 800 元（行业经验值）"},"M01":{"why":"床太低时起身要用手撑，久了腰背吃力。","do":"坐高调到 450 到 500 毫米，或加一块硬质床垫托；床边留一处能撑的地方。","cost":"300 到 1200 元（行业经验值）"},"M02":{"why":"起身时没有就近支撑。","do":"加床边助力扶手，或把床头柜换成略高于床面的高度当支撑面。","cost":"200 到 800 元（行业经验值）"},"M03":{"why":"坐面过软过深，坐下起不来。","do":"换偏硬、深度合适的坐面，沙发一侧加起身扶手。","cost":"500 到 2000 元（行业经验值）"},"M04":{"why":"茶几太低借不上力，离电视太近又挡动线。","do":"换略高于坐面的茶几，茶几到电视留 800 毫米以上通行宽度。","cost":"300 到 1500 元（行业经验值）"},"L01":{"why":"摸黑走夜路是常见失稳点。","do":"卧室到卫生间沿路加感应夜灯，选漫反射式不直射眼睛。","cost":"100 到 400 元（行业经验值）"},"L02":{"why":"开关离床远，起夜要摸黑找开关。","do":"床头加双控或换无线开关，两边都能关。","cost":"100 到 400 元（行业经验值）"},"L03":{"why":"亮度不够看不清障碍与高差。","do":"提高整体照度，主灯外补台灯与筒灯，避免只靠一个冷白主灯。","cost":"200 到 800 元（行业经验值）"},"L04":{"why":"起夜只有顶部照明会晃眼，看不清脚下。","do":"沿路加地脚感应灯，漫反射式，不影响同住的人。","cost":"100 到 400 元（行业经验值）"},"L05":{"why":"切菜和照镜子背光会有阴影，看不清刀口与面部。","do":"操作台上方加灯带或柜底灯，镜前加 1200 到 1800 毫米高度照明。","cost":"200 到 800 元（行业经验值）"},"K01":{"why":"忘记关火时没有熄火保护，燃气会持续泄漏。","do":"换带熄火保护的家用灶具；老灶先查是否带熄火保护装置。","cost":"800 到 2000 元（行业经验值）"},"K02":{"why":"燃气报警和烟雾报警都不能省，厨房是最容易出事的地方。","do":"燃气报警器装在天花下 300 毫米内、与灶水平距离 1500 毫米内，烟雾报警器装天花。","cost":"200 到 800 元（行业经验值）"},"K03":{"why":"常用品放太高，踮脚踩凳取物是高处摔倒的常见场景。","do":"常用品下移到腰胸高度，吊柜用下拉式拉篮，高部只放轻物。","cost":"300 到 1500 元（行业经验值）"},"K04":{"why":"台面高度不合适，做饭时腰背吃力。","do":"按老人身高定制台面高度，操作区宽度参考 800 毫米；不能改台面就加脚垫调整相对高度。","cost":"300 到 2000 元（行业经验值）"},"T01":{"why":"高柜不稳，靠扶时容易倾倒。","do":"用固定件把高柜与墙体连接，柜脚调平。","cost":"100 到 300 元（行业经验值）"},"T02":{"why":"挂衣区太高，抬手和踮脚都不稳。","do":"挂衣杆降到 1.2 到 1.5 米，中部 900 到 1800 毫米放当季衣物，可加感应灯带。","cost":"100 到 500 元（行业经验值）"},"T03":{"why":"药品和日用品到处放，急用时找不到，也容易误服。","do":"设固定位置分类摆放，常用药放腰胸高度，定期清理过期药。","cost":"100 到 300 元（行业经验值）"},"T04":{"why":"尖角磕碰对老人后果更重。","do":"换圆角家具，或在家具转角与墙面阳角贴防撞条、防撞角。","cost":"100 到 300 元（行业经验值）"},"I01":{"why":"摔倒或不舒服时够不到手机就求不到助。","do":"装呼叫器或拉绳，或戴一键呼叫手环；装好先教会怎么按。","cost":"200 到 800 元（行业经验值）"},"I02":{"why":"独居时远程看护能补上家人的视线。","do":"视情况装摄像头或毫米波雷达，装在公共区域，并跟老人讲清楚。","cost":"300 到 1500 元（行业经验值）"},"I03":{"why":"挂锁和难开的门锁让老人进出费劲，也影响急救。","do":"换指纹或密码智能门锁，或至少换成省力把手；留一把机械钥匙给家人。","cost":"800 到 3000 元（行业经验值）"}},"materials":{"结构安全与外围护":"结构修补按鉴定结论选材，不要自己用水泥砂浆盖缝；室内防水优先柔性防水涂料，屋面按外露要求选耐候型；密封条选三元乙丙或硅胶，耐老化优于 PVC。","电气与给排水":"电线选国标铜芯、按回路配线径；卫生间插座带防溅盒并接漏电保护；地漏选带水封或长条型，洗面盆与淋浴加存水弯；热水器看恒温与安全阀，老机先换镁棒。","门洞与通行":"门宽不够先改门套与门扇；把手选杠杆式或回弯型、表面防滑；推拉门选上轨承重、下轨平整不凸的，别选下轨高凸易绊的。","玄关与入户":"换鞋凳选带扶手或自带储藏的，坐面 40 到 45 厘米；鞋柜台面 0.9 到 1.0 米并与墙固定；挂钩选承重明装型，拐杖配立放架；灯带选低压安全型。","阳台与楼梯":"阳台地砖选防滑等级高的哑光款；晾衣杆选可升降或落地移动式；楼梯扶手选圆截面 35 到 50 毫米、末端回弯；过渡条选防滑耐磨、脚感不突兀的。","地面系统":"湿区选无釉面砖、石材或防滑疏水地垫，地垫选 TPR 乳胶底；干区可用 PVC 地板或碳化软木；避免深色花岗岩这类高反光材料，防止眩光。","卫浴空间":"扶手选圆截面带防滑纹，落地式或墙装式按墙体条件定；浴凳选可折叠带扶手型；花洒选可调高度滑杆；地漏选长条型；防滑垫选贴地不移位的。","卧室与起居":"床边扶手选可插入床垫底座的免打孔型；床头柜略高于床面；沙发选偏硬、坐深合适的；茶几选略高于坐面并做圆角。","照明系统":"夜灯选漫反射式、色温偏暖、感应灵敏的；开关选大面板，床头用双控或无线；镜前灯与柜底灯选显色好的，避免冷白直射。","厨房安全":"灶具选带熄火保护的；燃气与烟雾报警器选有认证的独立式；吊柜用下拉式拉篮或透明门；台面按身高定高，抽屉加阻尼减少弯腰。","收纳与防撞":"高柜加固定件与墙体连接；挂衣杆选可调高度；防撞条选环保软质、可拆洗的；药品收纳选分格盒，有条件加锁更稳。","智能设备":"呼叫器选一键呼叫加长续航；摄像头或雷达装在客厅等公共区域；智能门锁选支持指纹与密码、可临时授权的，备用机械钥匙交给家人。"},"basis":{"S04":"行业经验值（把手形式属使用便利项，无强制条文）","E01":"行业经验值（涉及电气线路作业应由持证电工实施）","E02":"行业经验值（家用漏电保护动作电流常按 30mA 计）","E04":"行业经验值","D03":"行业经验值","F02":"图解 ch11 与 ch12：高差不大于 15 毫米应完全消除，30 到 50 毫米用斜坡辅具","F03":"行业经验值","F04":"图解 ch06：套内主要通行与轮椅通行宽度参照","F05":"行业经验值","B05":"图解 ch11：卫生间宜采用外开门或推拉门","L02":"行业经验值","L03":"行业经验值","K01":"行业经验值（家用燃气灶应带熄火保护，具体以产品说明与现行标准为准）","K02":"图解 ch10：燃气报警器距天花不大于 300 毫米，与灶水平距离不大于 1500 毫米","K04":"图解 ch10：操作区宽度以 800 毫米为宜","T01":"行业经验值","T02":"图解 ch09：衣柜中部 900 到 1800 毫米为最易取用区","T03":"行业经验值","I01":"行业经验值","I02":"行业经验值","I03":"行业经验值"}};

function go(step){ S.step = step; save(); render(); window.scrollTo(0,0); }
function prog(t){ $('#prog').textContent = t || ''; }
function grade(p){
  if(p>=85) return ['A','基本没隐患','ok'];
  if(p>=70) return ['B','有几处要留意','mid'];
  if(p>=55) return ['C','有几处该动','mid'];
  return ['D','先把基础的几项补上','warn'];
}
function scoreOf(id){
  const v = S.answers[id];
  if(v === undefined) return 5;
  return v === 0 ? 10 : (v === 1 ? 5 : 0);
}
function quickScore(){
  let sum = 0;
  QUICK.forEach(x => { sum += scoreOf(x[1]); });
  return Math.round(sum/90*100);
}
function moduleScore(m){
  let got = 0, max = 0, answered = 0;
  m.questions.forEach(q => {
    max += Math.max.apply(null, q.options.map(o => o.score));
    const v = S.answers[q.id];
    if(v === undefined) return;
    answered++;
    got += q.options[v].score;
  });
  return { pct: max>0 ? Math.max(0, got/max) : 0, answered:answered };
}
function fullScore(){
  let num = 0, den = 0;
  const rows = [];
  MODULES.forEach(m => {
    const r = moduleScore(m), done = r.answered > 0;
    rows.push({ name:m.name, weight:m.weight, pct:r.pct, done:done, answered:r.answered, total:m.questions.length, budget:m.budget });
    if(done){ num += r.pct*m.weight; den += m.weight; }
  });
  return { score: den>0 ? Math.round(num/den*100) : 0, rows:rows };
}
function quickTop3(){
  const scored = QUICK.map(x => ({ mod:x[0], id:x[1], s:scoreOf(x[1]), ease:EASE[x[0]]||2 }));
  scored.sort((a,b) => a.s - b.s || a.ease - b.ease);
  return scored.filter(x => x.s < 10).slice(0,3);
}
function render(){
  const st = S.step;
  if(st === 'intro') return viewIntro();
  if(st === 'info') return viewInfo();
  if(st === 'quiz') return viewQuiz();
  if(st === 'result') return viewResult();
  if(st === 'lead') return viewLead();
  if(st === 'unlock') return viewUnlock();
  if(st === 'full') return viewFull();
  return viewReport();
}
function viewIntro(){
  prog('');
  app().innerHTML = '<div class="card">'
   + '<h1>爸妈的房子，哪些地方该动一动</h1>'
   + '<p class="sub">9 个问题，凭印象答就行，三分钟出分，最后给你三项最该动的地方，配大概怎么改、花多少钱。</p>'
   + '<p class="sub">答完不排名不打分，就是把家里角角落落过一遍，不确定的可以跳过。</p>'
   + '<button class="btn" onclick="go(\'info\')">开始安全初检</button></div>';
}
function viewInfo(){
  prog('基本信息');
  const i = S.info || {};
  app().innerHTML = '<div class="card"><h2>先了解几件基本情况</h2>'
   + '<div class="field"><label>怎么称呼你</label><input id="f-name" value="' + esc(i.name||'') + '" placeholder="例如 陈先生"></div>'
   + '<div class="field"><label>老人在哪个城市</label><input id="f-city" value="' + esc(i.city||'') + '" placeholder="例如 福州"></div>'
   + '<div class="field"><label>老人年龄段</label><input id="f-age" value="' + esc(i.age||'') + '" placeholder="60 到 69 / 70 到 79 / 80 以上"></div>'
   + '<div class="field"><label>平时怎么住</label><input id="f-live" value="' + esc(i.live||'') + '" placeholder="独居 / 与老伴 / 与子女"></div>'
   + '<div class="hint">这几项只在你手机上，答完不填联系方式也不会保存。</div>'
   + '<button class="btn" onclick="saveInfo()">开始答题</button></div>';
}
function saveInfo(){
  S.info = { name:$('#f-name').value.trim(), city:$('#f-city').value.trim(), age:$('#f-age').value.trim(), live:$('#f-live').value.trim() };
  startBatch(QUICK.map(x => x[1]), 'result');
}
let QUIZ = null;
function startBatch(list, after){ QUIZ = { list:list, idx:0, after:after }; go('quiz'); }
function nextQ(){
  QUIZ.idx++;
  if(QUIZ.idx >= QUIZ.list.length){ const after = QUIZ.after; QUIZ = null; return go(after); }
  window.scrollTo(0,0);
  render();
}
function viewQuiz(){
  const q = byId(QUIZ.list[QUIZ.idx]);
  if(!q){ const after = QUIZ.after; QUIZ = null; return go(after); }
  prog('第 ' + (QUIZ.idx+1) + ' / ' + QUIZ.list.length + ' 题');
  let html = '<div class="card"><p class="sub">' + esc(q.module) + (q.optional ? '<span class="pill">选答</span>' : '') + '</p><h2>' + esc(q.text) + '</h2>';
  q.options.forEach((o,i) => {
    html += '<button class="opt' + (S.answers[q.id] === i ? ' sel' : '') + '" onclick="pick(\'' + q.id + '\',' + i + ')">' + esc(o.text) + '</button>';
  });
  html += '<button class="btn ghost" onclick="nextQ()">这题不确定，跳过</button></div>';
  app().innerHTML = html;
}
function pick(id, idx){ S.answers[id] = idx; save(); nextQ(); }
function viewResult(){
  prog('安全初检结果');
  const p = quickScore(), g = grade(p), top = quickTop3();
  let html = '<div class="card"><p class="sub">居家适老化安全初检</p>'
   + '<div class="score ' + g[2] + '">' + p + '<span style="font-size:18px"> 分</span></div>'
   + '<p><span class="tag">' + g[0] + ' 级</span> ' + g[1] + '</p>';
  if(top.length === 0){
    html += '<p class="sub">九项都没看出明显问题，继续保持。想再细一点可以做一次完整体检。</p>';
  } else {
    html += '<h2 style="margin-top:18px">最该动的 ' + top.length + ' 处</h2>';
    top.forEach((t,i) => {
      const q = byId(t.id);
      const it = (ITEM.items && ITEM.items[q.id]) || {};
      html += '<div class="fix"><b>' + (i+1) + '. ' + esc(t.mod) + '</b>'
       + '<p class="sub">现在的情况：' + esc(q.options[S.answers[t.id]].text) + '</p>'
       + (it.why ? '<p class="sub">' + esc(it.why) + '</p>' : '')
       + '<p>' + esc(it.do || FIX[t.mod] || '') + '</p>'
       + '<p class="mini">大致花费：' + esc(it.cost || (q.budget + ' 元（行业经验值）')) + '</p></div>';
    });
  }
  html += '<div class="hint">想拿到 12 个模块 51 题的完整体检报告，留个联系方式，我把入口发给你。</div>'
   + '<button class="btn" onclick="go(\'lead\')">看看完整体检报告</button>'
   + '<button class="btn ghost" style="margin-top:10px" onclick="restart()">重新做一遍</button></div>';
  app().innerHTML = html;
}
function restart(){ if(confirm('清空已答内容，重新开始？')){ localStorage.removeItem(KEY); S = load(); go('intro'); } }
function viewLead(){
  prog('留联系方式');
  app().innerHTML = '<div class="card"><h2>完整体检报告里有什么</h2>'
   + '<p class="sub">比初检多 42 题，一共 51 道，一项项过。每处风险写清现在的情况、怎么改、大致花费区间，还有材料选购要点。</p>'
   + '<div class="field"><label>微信号或手机号（必填）</label><input id="f-contact" placeholder="方便我把完整体检报告入口发给你"></div>'
   + '<div class="field"><label>怎么称呼（选填）</label><input id="f-leadname" value="' + esc((S.info||{}).name||'') + '"></div>'
   + '<button class="btn" onclick="submitLead()">提交，领取完整体检报告入口</button>'
   + '<p class="mini">只用来发这份评估相关的内容，不会转给其他人。</p></div>';
}
function submitLead(){
  const v = $('#f-contact').value.trim();
  if(v.length < 5){ alert('请填微信号或手机号'); return; }
  const p = quickScore();
  const payload = { contact:v, name:$('#f-leadname').value.trim(), city:(S.info||{}).city||'', age:(S.info||{}).age||'', live:(S.info||{}).live||'',
    score:p, grade:grade(p)[0], weak:quickTop3().map(t => t.id), src:S.src, ts:new Date().toISOString(), line:'aging' };
  const log = JSON.parse(localStorage.getItem('yg_aging_leads') || '[]');
  log.push(payload); localStorage.setItem('yg_aging_leads', JSON.stringify(log));
  if(CONFIG.endpoint){
    fetch(CONFIG.endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }).catch(function(){});
  }
  go('unlock');
}
function viewUnlock(){
  prog('完整体检报告入口');
  const logs = JSON.parse(localStorage.getItem('yg_aging_leads') || '[]');
  let html = '<div class="card"><h2>完整体检报告入口</h2>'
   + '<p class="sub">已经收到你的联系方式。兑换码在面包多下单后自动发到订单消息里，手上已经有码的话直接输在下面。</p>';
  if(S.unlocked){
    html += '<p class="ok">已解锁完整体检报告。</p><button class="btn" onclick="startFull()">开始完整体检</button>';
  } else {
    html += '<div class="field"><label>兑换码</label><input id="f-code" placeholder="例如 YG-XXXX-XX"></div>'
     + '<button class="btn" onclick="tryCode()">解锁完整体检报告</button>'
     + (CONFIG.mbdUrl ? '<a class="btn ghost" style="margin-top:10px" href="' + CONFIG.mbdUrl + '">还没有码，去下单</a>' : '');
  }
  html += '<button class="btn ghost" style="margin-top:10px" onclick="copyLead()">复制我的评估信息，回私信发我</button>' + '<p class="mini">本机提交记录：' + logs.length + ' 条（仅存本机，用于对账）。</p>'
   + '<button class="btn ghost" style="margin-top:10px" onclick="go(\'result\')">返回结果</button></div>';
  app().innerHTML = html;
}
function tryCode(){
  const c = $('#f-code').value.trim().toUpperCase();
  if(CONFIG.codes.map(x => x.toUpperCase()).indexOf(c) < 0){ alert('这个码没认出来，核对一下，或者找我要一个新的。'); return; }
  S.unlocked = true; S.usedCode = c; save();
  alert('解锁成功'); render();
}
function startFull(){
  const rest = [];
  ALL.forEach(q => { if(S.answers[q.id] === undefined) rest.push(q.id); });
  if(rest.length === 0) return go('report');
  startBatch(rest, 'report');
}
function viewFull(){
  const done = Object.keys(S.answers).length;
  prog('完整体检 ' + done + ' / ' + ALL.length);
  app().innerHTML = '<div class="card"><h2>开始完整体检</h2>'
   + '<p class="sub">还剩 ' + (ALL.length-done) + ' 题，一组一组过，选答题可以先跳过。</p>'
   + '<button class="btn" onclick="startFull()">继续答题</button></div>';
}
function viewReport(){
  prog('完整体检报告');
  const r = fullScore(), g = grade(r.score);
  let html = '<div class="card"><p class="sub">居家适老化完整体检报告</p>'
   + '<div class="score ' + g[2] + '">' + r.score + '<span style="font-size:18px"> 分</span></div>'
   + '<p><span class="tag">' + g[0] + ' 级</span> ' + g[1] + '</p>';
  const weak = r.rows.filter(x => x.done && x.pct < 0.7).sort((a,b) => a.pct - b.pct).slice(0,3);
  if(weak.length){
    html += '<h2 style="margin-top:18px">最该动的 ' + weak.length + ' 处</h2>';
    weak.forEach((w,i) => {
      const mo = MODULES.find(m => m.name === w.name);
      let worst = null;
      if(mo){ mo.questions.forEach(q => {
        const v = S.answers[q.id];
        if(v === undefined) return;
        const sc = q.options[v].score;
        if(worst === null || sc < worst.sc) worst = { q:q, v:v, sc:sc };
      }); }
      const it = worst ? ((ITEM.items && ITEM.items[worst.q.id]) || {}) : {};
      html += '<div class="fix"><b>' + (i+1) + '. ' + esc(w.name) + '（得分率 ' + Math.round(w.pct*100) + '%）</b>'
       + (worst ? '<p class="sub">最弱一项：' + esc(worst.q.text) + '（' + esc(worst.q.options[worst.v].text) + '）</p>' : '')
       + (it.why ? '<p class="sub">' + esc(it.why) + '</p>' : '')
       + '<p>' + esc(it.do || FIX[w.name] || '先把模块里扣分的那几项处理掉') + '</p>'
       + '<p class="mini">大致花费：' + esc(it.cost || (w.budget + ' 元（行业经验值）')) + '</p></div>';
    });
  } else {
    html += '<p class="sub">已答模块里没看出明显短板。</p>';
  }
  html += '<h2 style="margin-top:20px">模块明细</h2>';
  r.rows.forEach(row => {
    if(!row.done){ html += '<div class="row"><span>' + esc(row.name) + '</span><span class="sub">未评估</span></div><div class="bar"><i style="width:0"></i></div>'; return; }
    const pc = Math.round(row.pct*100);
    html += '<div class="row"><span>' + esc(row.name) + '</span><span>' + pc + '%</span></div><div class="bar"><i style="width:' + pc + '%"></i></div>';
  });
  html += '<h2 style="margin-top:20px">需要留意的具体项</h2>';
  const bad = [];
  ALL.forEach(q => { const v = S.answers[q.id]; if(v !== undefined && q.options[v].score < 0) bad.push({ q:q, o:q.options[v] }); });
  if(bad.length === 0){ html += '<p class="sub">没有出现扣分项。</p>'; }
  else {
    bad.forEach(x => {
      const it = (ITEM.items && ITEM.items[x.q.id]) || {};
      html += '<div class="fix"><b>' + esc(x.q.module) + '：' + esc(x.q.text) + '</b>'
       + '<p class="sub">你家的情况：' + esc(x.o.text) + '</p>'
       + (it.why ? '<p class="sub">' + esc(it.why) + '</p>' : '')
       + (it.do ? '<p>' + esc(it.do) + '</p>' : '')
       + (it.cost ? '<p class="mini">大致花费：' + esc(it.cost) + '</p>' : '')
       + (basisOf(x.q) ? '<p class="mini">参考：' + esc(basisOf(x.q)) + '</p>' : '')
       + '</div>';
    });
  }
  html += '<h2 style="margin-top:20px">材料选购要点</h2>';
  r.rows.forEach(row => {
    const mm = (ITEM.materials || {})[row.name];
    if(!mm) return;
    html += '<details style="margin:8px 0"><summary style="cursor:pointer;font-weight:600">' + esc(row.name) + '</summary><p class="sub">' + esc(mm) + '</p></details>';
  });
  html += '<div class="hint">这份报告是按你填的情况给的判断，具体做法和尺寸还要看现场。</div>'
   + '<button class="btn ghost" onclick="copyReport()">复制我的得分</button></div>';
  app().innerHTML = html;
}
const BGM_KEY = "yg_aging_bgm";
const BGM_DEFAULT = "on";
let bgmOn = (localStorage.getItem(BGM_KEY) || BGM_DEFAULT) === "on";
function bgmPaint(){
  const b = document.getElementById("bgmbtn");
  if(!b) return;
  if(bgmOn){ b.classList.remove("off"); } else { b.classList.add("off"); }
  b.title = bgmOn ? "背景音乐已开，点一下关闭" : "背景音乐已关，点一下打开";
}
function bgmStart(){
  const a = document.getElementById("bgm");
  if(!a || !bgmOn) return;
  a.play().catch(function(){ const b = document.getElementById("bgmbtn"); if(b) b.style.display = "none"; });
}
function toggleBgm(){
  const a = document.getElementById("bgm");
  if(!a) return;
  if(bgmOn && a.paused && !a.currentTime){ a.play().catch(function(){}); bgmPaint(); return; }
  bgmOn = !bgmOn;
  try{ localStorage.setItem(BGM_KEY, bgmOn ? "on" : "off"); }catch(e){}
  if(bgmOn){ a.play().catch(function(){}); } else { a.pause(); }
  bgmPaint();
}
function bgmInit(){
  const a = document.getElementById("bgm");
  if(!a) return;
  a.volume = 0.5;
  a.addEventListener("error", function(){ const b = document.getElementById("bgmbtn"); if(b) b.style.display = "none"; });
  document.addEventListener("pointerdown", bgmStart, { once:true });
  bgmPaint();
}
bgmInit();

  function copyLead(){
  const logs = JSON.parse(localStorage.getItem("yg_aging_leads") || "[]");
  const last = logs[logs.length-1] || {};
  const top = quickTop3().map(function(t){ return t.mod; }).join("、");
  const p = quickScore();
  const txt = "居家适老化体检 · 安全初检：" + (last.name||"") + " " + (last.city||"") + " " + (last.age||"") + " " + (last.live||"") + "。得分 " + p + " 分，" + grade(p)[0] + " 级。最该动的：" + (top || "无明显短板") + "。我的联系方式：" + (last.contact||"");
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ alert("已复制，回私信粘贴发我就行"); }, function(){ alert(txt); }); }
  else { alert(txt); }
}
function copyReport(){
  const r = fullScore();
  const txt = '居家适老化体检：' + r.score + ' 分（' + grade(r.score)[0] + ' 级）。短板模块：'
    + r.rows.filter(x => x.done && x.pct < 0.7).map(x => x.name).join('、');
  if(navigator.share){ navigator.share({ text:txt }).catch(function(){}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ alert('已复制'); }); }
  else { alert(txt); }
}
render();
</script>
